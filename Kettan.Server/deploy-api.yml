name: Deploy Kettan API
on:
  push:
    branches: [ latest ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        # We point directly to the Kettan.Server folder
        run: dotnet publish Kettan.Server/Kettan.Server.csproj -c Release -o ./publish

      - name: Deploy to MonsterASP (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.API_FTP_SERVER }}
          username: ${{ secrets.API_FTP_USERNAME }}
          password: ${{ secrets.API_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/