name: Deploy Kettan API
on:
  push:
    branches: [ latest ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        # Targets the backend subfolder
        run: dotnet publish Kettan.Server/Kettan.Server.csproj -c Release -o ./publish

      - name: Create app_offline.htm
        # This shuts down the app gracefully to unlock files
        run: echo "<h1>System Updating...</h1>" > ./publish/app_offline.htm

      - name: Deploy to MonsterASP (Lock Files)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.API_FTP_SERVER }}
          username: ${{ secrets.API_FTP_USERNAME }}
          password: ${{ secrets.API_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/

      - name: Bring App Back Online
        run: rm ./publish/app_offline.htm

      - name: Final Sync (Restart App)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.API_FTP_SERVER }}
          username: ${{ secrets.API_FTP_USERNAME }}
          password: ${{ secrets.API_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: false