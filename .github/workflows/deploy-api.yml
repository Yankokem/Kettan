name: Deploy Kettan API
on:
  push:
    branches: [ latest ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        # Targets the backend subfolder
        run: dotnet publish Kettan.Server/Kettan.Server.csproj -c Release -o ./publish

      - name: Take App Offline
        # Use cURL to specifically upload app_offline.htm alone, then sleep so IIS releases the DLLs
        run: |
          echo "<h1>System Updating...</h1>" > app_offline.htm
          FTP_HOST=$(echo "${{ secrets.API_FTP_SERVER }}" | sed -e 's|^ftp://||' -e 's|^ftps://||')
          curl --insecure --ftp-ssl -T app_offline.htm "ftp://${FTP_HOST}/wwwroot/app_offline.htm" --user "${{ secrets.API_FTP_USERNAME }}:${{ secrets.API_FTP_PASSWORD }}"
          sleep 10

      - name: Deploy to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.API_FTP_SERVER }}
          username: ${{ secrets.API_FTP_USERNAME }}
          password: ${{ secrets.API_FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/

      - name: Bring App Back Online
        # Delete app_offline.htm via cURL to restore the app
        run: |
          FTP_HOST=$(echo "${{ secrets.API_FTP_SERVER }}" | sed -e 's|^ftp://||' -e 's|^ftps://||')
          curl --insecure --ftp-ssl -Q "DELE /wwwroot/app_offline.htm" "ftp://${FTP_HOST}/" --user "${{ secrets.API_FTP_USERNAME }}:${{ secrets.API_FTP_PASSWORD }}" || true